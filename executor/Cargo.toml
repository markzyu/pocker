[package]
name = "pocker-executor"
description = "The executor crate of pocker -- a multithreaded incomplete rewrite of proot"
version = "0.2.0"
authors = ["Zhongzhi Yu <7296488+markzyu@users.noreply.github.com>"]
repository = "https://github.com/markzyu/pocker"
license = "GPL-3.0-or-later"
edition = "2024"

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
krsm = {path = "../krsm", version = "0.3"}
pocker-ptrace = {path = "../ptrace", version = "0.2"}
futures-lite = "2.6.1"
lazy_static = "1.4.0"
libc = "0.2.189"
nix = "0.31.3"
thiserror = "1.0.25"
tracing = "0.1.26"
