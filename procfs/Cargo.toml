[package]
name = "pocker-procfs"
description = "The procfs crate of pocker -- a multithreaded incomplete rewrite of proot"
version = "0.3.0"
authors = ["Zhongzhi Yu <7296488+markzyu@users.noreply.github.com>"]
repository = "https://github.com/markzyu/pocker"
license = "GPL-3.0-or-later"
edition = "2024"

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
flate2 = "1.0.19"
nix = {version = "0.31.3", features = ["process"]}
thiserror = "1.0.25"
tracing = "0.1.26"
