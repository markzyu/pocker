[package]
name = "pocker-ptrace"
description = "The ptrace crate of pocker -- a multithreaded incomplete rewrite of proot"
version = "0.3.0"
authors = ["Zhongzhi Yu <7296488+markzyu@users.noreply.github.com>"]
repository = "https://github.com/markzyu/pocker"
license = "GPL-3.0-or-later"
edition = "2024"

[lints]
workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
backtrace = "0.3"
lazy_static = "1.4.0"
libc = "0.2.189"
lru = "0.16.1"
nix = { version = "0.31.3", features = ["mman", "process", "ptrace", "signal", "fs"] }
thiserror = "1.0.25"
tracing = "0.1.26"

[dev-dependencies]
ntest = "0.7.2"
